# Exemplo de site nginx para o HaxLike.
# Copie para /etc/nginx/sites-available/haxlike (ou /etc/nginx/conf.d/haxlike.conf),
# troque "jogo.seudominio.com" pelo seu domínio e veja docs/deploy-vps.md.

# Se o seu nginx.conf já tiver um "map $http_upgrade ..." com outro nome de variável,
# reaproveite-o ou mantenha este (nomes diferentes não conflitam).
map $http_upgrade $haxlike_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream haxlike {
    # Porta publicada pelo container (HOST_PORT no compose.yaml).
    server 127.0.0.1:8787;
}

server {
    listen 80;
    listen [::]:80;
    server_name jogo.seudominio.com;

    # O certbot (--nginx) adiciona aqui o redirecionamento para HTTPS e o bloco "listen 443 ssl".

    location / {
        proxy_pass http://haxlike;
        proxy_http_version 1.1;

        # Necessário para o WebSocket do multiplayer (/ws).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $haxlike_connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Partidas são conexões longas: não derrubar WebSockets "parados" depois de 60 s.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
